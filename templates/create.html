{% extends 'base.html' %}{% block title %}Write a Post — The Daily Blog{% endblock %}{% block content %}<section class="form-area"><form class="editor-card" method="post"><p class="eyebrow">Your story matters</p><h1>Create a new post</h1><label for="title">Post title</label><input id="title" name="title" required maxlength="160" placeholder="Give your story a title"><label for="summary">Short summary</label><textarea id="summary" name="summary" rows="3" required maxlength="300" placeholder="What is this post about?"></textarea><label for="content">Article content</label><textarea id="content" name="content" rows="10" required placeholder="Start writing..."></textarea><div class="form-actions"><a class="button button-outline" href="{{ url_for('index') }}">Cancel</a><button class="button" type="submit">Publish post</button></div></form></section>{% endblock %}
