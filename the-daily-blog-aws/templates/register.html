{% extends 'base.html' %}{% block title %}Create Account — The Daily Blog{% endblock %}{% block content %}<section class="auth-area"><form class="auth-card" method="post"><div class="auth-icon">✍️</div><h1>Create Account</h1><p class="muted">Join the community and share your ideas.</p><label for="username">Username</label><input id="username" name="username" required maxlength="40" autocomplete="username"><label for="email">Email address</label><input id="email" name="email" type="email" required autocomplete="email"><label for="password">Password</label><input id="password" name="password" type="password" minlength="8" required autocomplete="new-password"><button class="button full" type="submit">Create Account</button><p class="auth-bottom">Already registered? <a href="{{ url_for('login') }}">Log in</a></p></form></section>{% endblock %}
